<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu jogo canvas</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="game-stage">
      <canvas id="game" width="800" height="450" aria-label="Area do jogo"></canvas>
      <input id="answer-input" type="text" aria-label="Digite sua resposta" placeholder="Digite sua resposta..." autocomplete="off" hidden />
      <div id="menu-screen" aria-label="Tela inicial">
        <iframe src="assets/jogar.pdf" title="Tela inicial do jogo"></iframe>
        <img id="menu-tree" src="assets/arvore.png" alt="" aria-hidden="true" />
        <img id="menu-ini3" src="assets/ini3.png" alt="" aria-hidden="true" />
        <img id="menu-tower" src="assets/torre.png" alt="" aria-hidden="true" />
        <img id="menu-ground" src="assets/inicio2-completo.png" alt="" aria-hidden="true" />
        <button id="start-game" type="button">START</button>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
